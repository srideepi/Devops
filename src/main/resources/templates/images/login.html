<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattefy - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <img src="logo.png" alt="Lattefy Logo" class="logo">
            <h1 style="font-family:Lucida Calligraphy; font-size: 3rem;">lattefy</h1>
            <form>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password">
                    <span class="password-toggle" onclick="togglePasswordVisibility()">
                       
                </div>
                <div class="links-container"> <a href="#" class="forgot-password">Forget password?</a>
                <a href="#" class="signup-link">Sign Up</a></div>
               
                <button type="submit" class="login-button">LOGIN</button>
            </form>
            <div class="or-divider">OR</div>
            <button class="google-login">
                <img src="google-icon.png" alt="Google Icon"> Continue with Google
            </button>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
        }
    </script>
</body>
</html>
